[[sections]]
title = "考核方式"

[[sections.items]]
content = """
24 级考核方式如下：

三轮答辩（开题、中期、结题），均需**全员**前往鹏城实验室进行。答辩评委由授课教师（即各课题组的指导老师）组成，每位导师既指导自己的学生，也评审其他导师的学生。

- 形式：5 分钟限时汇报，提问与批评不限时
- 日程：各节点时间由课程组灵活安排，不同年级时间不同，以实际通知为准。以 24 级为例：开题答辩 2025-12-18，中期答辩 2026-05-12，结题答辩尚未通知（预计 8 月底至 9 月初）

**评分标准不公开**，最终由课程负责人综合评定。

课题实施期间需在鹏城实验室进行，学生需办理电子门禁。
"""
author = { name = "aqua", link = "https://github.com/marine-aqua", date = "2026-07" }

