[[sections]]
title = "实际运作"

[[sections.items]]
content = """
**鹏城实验室**

- 无固定工位，大部分工作采用远程办公的形式
- 通勤：打车约 30 分钟（不堵车），地铁约 1 小时
- 网络：不认外来学生账号，课题期间网络使用可能受限
- 门禁：需办理电子门禁（提前准备一寸照片）。门禁系统稳定性一般

**费用**

课程不提供任何正规报销，包括但不限于：AI 模型调用费用、云端集群租赁费用、往返鹏城实验室的交通费（打车/地铁）。不确定个别课题组是否会自行承担，建议选题后向导师确认。

**被牺牲的基础课**

为给基础项目实践（大二，240 学时）腾出空间，培养方案做出了大幅度的调整。原本在大二秋季学期开设的数据结构与算法、概率论与数理统计被挪到了大一春季学期，而大一春季学期开设的电路与电子学挪到了大二秋季学期，从考试课变成了考查课。大二春季学期开设的信号与系统、系统与控制两门课程，也从考试课，变成了二选一的限选课程。
"""
author = { name = "aqua", link = "https://github.com/marine-aqua", date = "2026-07" }

# ===== 建议层 =====
[[sections]]
title = "工作量与回报"

[[sections.items]]
content = """
名义上 240 学时。工作量完全取决于导师个人要求，不同组之间差异巨大——有的组全程相对轻松，有的组开题阶段即需高强度投入。

正因投入巨大，如果最终课题成果无法转化为简历上的亮点（论文、竞赛、项目经历等），这门课就成了一笔极大的负资产。为了达到通过答辩的基本要求，你需要了解项目背景、接受学术审美，反复迭代答辩 PPT 与报告。对于普通人而言，光是准备答辩，可能就需要标定学时的 70% 的工作量。而通过答辩只意味着拿到了 2 学分，知识、技能都没有留下，甚至是负作用。

考虑到 240 学时的总投入体量，以及培养方案为此做出的课程性质调整，产出率是一个不应被回避的参考维度。建议从一开始就以"能写进简历"的标准推进，主动与导师沟通争取有含金量的产出。

集中培训共 2 次，每个主题本身都很庞大，2 小时只能浅尝辄止。对有编程和深度学习基础的同学帮助有限，不要指望培训能补齐课题所需的技术栈。
"""
author = { name = "aqua", link = "https://github.com/marine-aqua", date = "2026-07" }

[[sections]]
title = "通过率"

[[sections.items]]
content = """
评分标准不透明，但从往届情况看，只要持续投入、认真推进课题，基本不会挂科。但消极应付、公开抨击课程会带来不必要的麻烦，建议专注于课题本身。
"""
author = { name = "aqua", link = "https://github.com/marine-aqua", date = "2026-07" }

[[sections]]
title = "选题与导师"

[[sections.items]]
content = """
- 双选实质是**先到先得**。导师名额有限，组队拖到后期的学生可能面临无课题可选的风险，无官方调剂机制。若最终未能选定导师，无法正常完成课程
- 不同导师的投入程度和指导风格差异极大：有的全程紧盯，有的很难联系上。建议选导师前多方打听往届体验
- 课题方向偏向研究生层次（3D 重建、多模态感知、通信感知一体化、大模型架构等），大二学生需大量额外学习。**尤其注意两个通信相关课题（波束赋形、通信资源分配），不建议选择**。人工智能班的课程体系里，大二秋学复变函数，大二春学信号与系统，而通信原理是通信方向的大三春专业限选课——按正常节奏，结题答辩（大二夏）结束一年后才能学到。没有通信原理基础直接做波束赋形和通信资源分配，相当于跳过了整个知识体系的中层。
"""
author = { name = "aqua", link = "https://github.com/marine-aqua", date = "2026-07" }

[[sections]]
title = "答辩"

[[sections.items]]
content = """
三轮答辩均需前往鹏城实验室，形式为 5 分钟限时汇报 + 不限时专家批评。评委当众指出问题，心理压力较大。建议提前充分准备，对评委提问有合理预期。
"""
author = { name = "aqua", link = "https://github.com/marine-aqua", date = "2026-07" }

[[sections]]
title = "队友"

[[sections.items]]
content = """
组队后绑定一整个学年，且为必修课无人可中途退出。组队前务必确认对方靠谱，避免因分工不均导致全年摩擦。组队信息不对称（以为已和某人组队但对方实际另有选择）时有发生，建议尽早确认并锁定队友。
"""
author = { name = "aqua", link = "https://github.com/marine-aqua", date = "2026-07" }

[[sections]]
title = "与电子工艺实习的对比"

[[sections.items]]
content = """
电子工艺实习（80 实践学时 / 2 学分）和这门课的情况很相似。实际用时超过标定学时，周末被大量占用，硬件损坏不更换，学生作品需回收不给带走。它在行政层面的问题不亚于基础项目实践。

但两门课有一个关键差异：

**电子工艺实习**的骨架是一条清晰的技能链：元器件识别 → 电路设计与仿真 → PCB 绘制 → 焊接调试 → 软件开发（GPIO、流水灯、串口通信、ADC、SPI、电机驱动）→ 项目集成。即使你不走嵌入式方向、即使队友焊错单片机让你多花了两倍时间，这门课仍然让你走完了全程，你对整个流程有完整的认知。它的问题是执行层面的（学时超标、器件老损、前置知识缺失），但骨架在。

**基础项目实践**的骨架不成立。它依赖导师的个人意愿和研究生的课题进度来填充你的 240 小时。遇到负责任的导师和合适的课题，体验尚可；遇到不合适的匹配，你的角色是围绕已有 demo 写 PPT 和专利，全程不产生可迁移的技能。
"""
author = { name = "aqua", link = "https://github.com/marine-aqua", date = "2026-07" }

[[sections]]
title = "关于答辩"

[[sections.items]]
content = """
以下只代表我个人的答辩经历，不同导师、不同课题的情况可能差异很大。

**答辩前：没人教过你"创新"是什么意思**

答辩评委由授课教师组成，他们同时是鹏城实验室的研究者，自然会用学术标准审视你的工作。学术界的核心关切是"生产新知识"——如果你的结果前人已经做过，学术价值就是零。这决定了答辩一定会追问你的工作"新在哪里"。

问题在于，判断一个东西新不新需要文献调研能力——查什么关键词、读哪些会议期刊、怎么定位 research gap。大二课程体系不会覆盖这些。方向是导师定的，技术路线是研究生搭的，你可能不太有概念课题处在什么位置，但必须用"有学术价值"去呈现它。

**答辩中：评分没有标准，也因此不值得焦虑**

每位导师既指导自己的学生，也评审其他导师的学生。整个评判过程没有公开的评分细则，最终由课程负责人一人决定。你的分数跟你做了什么之间没有透明的关系——不是针对谁，是这个机制本身做不到标准化。

但反过来说，这门课是考查课，分数高低对 GPA 没有实际影响。知道分数没有参考意义，反而可以放下对答辩的过度紧张，把精力集中在课题本身和你真正能带走的东西上。
"""
author = { name = "aqua", link = "https://github.com/marine-aqua", date = "2026-07" }

[[sections]]
title = "AI 工具"

[[sections.items]]
content = """
以下只代表我个人的经历，不同导师对 AI 的态度可能不同。

**你会被期望用 AI，但不会有人教你怎么用**

我的导师自己高频使用 AI，遇到问题第一反应是"这东西你们不能用 AI 解决吗？"。他清楚 AI 的输出不一定对，也知道 AI 的水平取决于使用者的引导能力——但这些观察很少转化为具体的指导。

在这门课里，你会被期望用 AI 辅助理解文献、写报告、debug 代码。但实际处境是一个夹心层：你还不太懂这个领域，AI 也不懂你的具体上下文。你只能靠模糊的 prompt 来回试，猜着让 AI 猜你在问什么。

**AI 的输出质量，取决于你对问题的理解程度**

同一个 AI 工具，懂行的人能给出精确的背景、约束和期望格式，输出就可靠得多。不太懂的人只能提一个宽泛的问题，AI 需要先理解意图再回答，出错概率更大。这不是 AI 的问题——提示词的质量本身受限于你的领域知识。

这意味着在你还不太懂的阶段，AI 更容易给你"看起来对"的答案。验证的工作量在你身上，省不掉。

**关注工具进展**

AI 工具在快速迭代。以 Coding Agent 为例，相比直接在对话框里对话，它有两个关键提升：让大模型具备了使用工具的能力（读文件、跑代码、搜索），以及更完整的上下文窗口能显著减轻幻觉。建议持续关注工具进展——这可能是这门课里少数几个你完全能控制、并且对之后所有工作都有用的变量。
"""
author = { name = "aqua", link = "https://github.com/marine-aqua", date = "2026-07" }

[[sections]]
title = "进度管理"

[[sections.items]]
content = """
以下只代表我个人的经历，不同导师、不同课题的情况可能差异很大。

**你的时间线不完全由你控制**

三轮答辩的日期由课程组临时通知，没有固定日程。更关键的是，导师可以在任何阶段否定你的方向——我自己就经历过开题方向被导师全盘否定、中期换成一套完全不同的方案。前期一个月的工作量全部归零，需要从头理解新的技术路线，重新写 PPT。不是因为做得不够好，是方向的决定权不完全在你自己手上。

**往前赶，留缓冲**

面对这个不确定性，唯一能做到的是趁方向明确的时候尽量往前赶。估算时间时，在你觉得"应该"的时长上乘以一个缓冲系数（1.5-2 倍）——你不知道下一次答辩通知有多紧，也不知道什么时候会被要求调整方向。留出的余量不是让你偷懒的，是用来吸收意料之外的。
"""
author = { name = "aqua", link = "https://github.com/marine-aqua", date = "2026-07" }

